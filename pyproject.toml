[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "long-read-nanopore-methylation-agent"
version = "2.0.0"
description = "NanoMethyl Sentinel: 5mC / 5hmC Oxford Nanopore Current Trace Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0,<3",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
long-read-nanopore-methylation-engine = "nanomethyl_sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/long-read-nanopore-methylation-engine"
Repository = "https://github.com/abusuraihsakhri/long-read-nanopore-methylation-agent.git"
